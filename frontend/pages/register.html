<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — NES Camo Tracker</title>
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav-root"></div>

<main>
  <div class="card form-panel">
    <h2 style="margin-top:0;">Create Account</h2>
    <p style="color:var(--muted); font-size:13px; margin-top:-8px;">No real name or email required — just a username and password.</p>
    <div class="form-error" id="form-error"></div>
    <form id="register-form">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" required />
      </div>
      <div class="form-field">
        <label for="email">Email <span style="color:var(--muted); font-weight:400;">(optional)</span></label>
        <input type="email" id="email" name="email" autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign Up</button>
    </form>
    <div class="form-footer-link">Already have an account? <a href="/pages/login.html">Log in</a></div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/register.js"></script>
</body>
</html>
