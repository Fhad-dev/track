<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game — NES Camo Tracker</title>
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav-root"></div>

<main>
  <div id="game-header-root"></div>

  <div class="container">
    <div class="filters-bar">
      <input type="text" id="weapon-search" placeholder="Search weapons..." />
      <select id="category-filter">
        <option value="">All Categories</option>
      </select>
    </div>
    <div id="section-tabs" class="section-tabs"></div>
    <div class="grid" id="weapons-grid">
      <div class="skeleton" style="height:150px;"></div>
      <div class="skeleton" style="height:150px;"></div>
      <div class="skeleton" style="height:150px;"></div>
      <div class="skeleton" style="height:150px;"></div>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/game.js"></script>
</body>
</html>
