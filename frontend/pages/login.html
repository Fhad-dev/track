<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — NES Camo Tracker</title>
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav-root"></div>

<main>
  <div class="card form-panel">
    <h2 style="margin-top:0;">Log In</h2>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log In</button>
    </form>
    <div class="form-footer-link">Don't have an account? <a href="/pages/register.html">Sign up</a></div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
